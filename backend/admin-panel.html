<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoForest Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0812;color:#e2e8f0;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0a0812 0%,#1a1030 50%,#0d1829 100%)}
.login-card{background:rgba(255,255,255,0.03);border:1px solid rgba(139,92,246,0.15);border-radius:20px;padding:48px 40px;width:100%;max-width:400px;backdrop-filter:blur(20px);box-shadow:0 25px 80px rgba(0,0,0,0.5)}
.login-card h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#a78bfa,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-card p{text-align:center;color:#64748b;font-size:13px;margin-bottom:32px}
.login-card input{width:100%;padding:14px 18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#e2e8f0;font-size:15px;outline:none;transition:border-color .2s}
.login-card input:focus{border-color:#8b5cf6}
.login-card button{width:100%;padding:14px;margin-top:20px;background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
.login-card button:hover{opacity:0.9}
.login-card button:active{transform:scale(0.98)}
.login-card .error{color:#f87171;font-size:13px;text-align:center;margin-top:16px;min-height:20px}
#app-screen{display:none;min-height:100vh}
#app-screen.active,#login-screen.hidden{display:none}
#app-screen.active{display:flex}
#login-screen.hidden{display:none}
.sidebar{width:260px;min-width:260px;background:rgba(255,255,255,0.02);border-right:1px solid rgba(255,255,255,0.06);padding:24px 16px;display:flex;flex-direction:column}
.sidebar h2{font-size:18px;font-weight:700;margin-bottom:32px;padding:0 8px}
.sidebar nav{flex:1;display:flex;flex-direction:column;gap:4px}
.sidebar nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:#94a3b8;font-size:14px;cursor:pointer;text-align:left;transition:all .15s;width:100%}
.sidebar nav button:hover{background:rgba(255,255,255,0.04);color:#e2e8f0}
.sidebar nav button.active{background:rgba(139,92,246,0.12);color:#a78bfa}
.sidebar .logout-btn{margin-top:auto;padding:10px 12px;border-radius:10px;border:1px solid rgba(239,68,68,0.2);background:transparent;color:#f87171;font-size:13px;cursor:pointer;width:100%;text-align:center;transition:all .15s}
.sidebar .logout-btn:hover{background:rgba(239,68,68,0.1)}
.main{flex:1;padding:32px;overflow-y:auto}
.main h2{font-size:22px;font-weight:700;margin-bottom:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:20px}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .value.purple{color:#a78bfa}
.stat-card .value.blue{color:#60a5fa}
.stat-card .value.green{color:#34d399}
.stat-card .value.red{color:#f87171}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;border-bottom:1px solid rgba(255,255,255,0.06);font-weight:600}
td{padding:14px 16px;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.03)}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.badge.active{background:rgba(34,197,94,0.15);color:#22c55e}
.badge.blocked{background:rgba(239,68,68,0.15);color:#ef4444}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-block{background:rgba(239,68,68,0.12);color:#f87171}
.btn-block:hover{background:rgba(239,68,68,0.25)}
.btn-unblock{background:rgba(34,197,94,0.12);color:#34d399}
.btn-unblock:hover{background:rgba(34,197,94,0.25)}
.btn-detail{background:rgba(96,165,250,0.12);color:#60a5fa}
.btn-detail:hover{background:rgba(96,165,250,0.25)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#13111e;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:20px}
.modal label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px;margin-top:16px}
.modal input,.modal textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none}
.modal textarea{min-height:80px;resize:vertical}
.modal .actions{display:flex;gap:12px;margin-top:24px;justify-content:flex-end}
.modal .actions button{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer}
.modal .cancel-btn{background:rgba(255,255,255,0.05);color:#94a3b8}
.modal .confirm-btn{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.loading{text-align:center;padding:40px;color:#64748b}
.empty{text-align:center;padding:60px 20px;color:#475569;font-size:14px}
.user-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.user-detail-grid .item{background:rgba(255,255,255,0.03);border-radius:10px;padding:12px}
.user-detail-grid .item .label{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:0.5px}
.user-detail-grid .item .value{font-size:14px;color:#e2e8f0;margin-top:4px}
.file-list{max-height:300px;overflow-y:auto}
.file-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03)}
.file-row .path{color:#94a3b8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}
.file-row .size{color:#64748b;white-space:nowrap}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <h1>🔐 GeoForest Admin</h1>
    <p>Painel de administração</p>
    <input type="password" id="password-input" placeholder="Senha de admin" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Entrar</button>
    <div class="error" id="login-error"></div>
  </div>
</div>
<div id="app-screen">
  <div class="sidebar">
    <h2>⚡ GeoForest</h2>
    <nav>
      <button class="active" onclick="showTab('dashboard')" id="nav-dashboard">📊 Dashboard</button>
      <button onclick="showTab('users')" id="nav-users">👥 Usuários</button>
      <button onclick="showTab('system')" id="nav-system">🖥️ Sistema</button>
    </nav>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </div>
  <div class="main" id="main-content"></div>
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<script>
const API = '';
let token = localStorage.getItem('admin_token') || '';
let currentTab = 'dashboard';

function api(path, opts={}) {
  return fetch(API+path, {
    headers:{...opts.headers||{},'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    ...opts
  }).then(r=>r.json().then(d=>({ok:r.ok,status:r.status,...d})));
}

async function login() {
  const pw = document.getElementById('password-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  const r = await api('/api/admin/login', {method:'POST',body:JSON.stringify({password:pw})});
  if (r.ok && r.token) {
    token = r.token;
    localStorage.setItem('admin_token', token);
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.add('active');
    loadDashboard();
  } else {
    err.textContent = r.error || 'Senha incorreta';
  }
}

function logout() {
  token = '';
  localStorage.removeItem('admin_token');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-screen').classList.remove('active');
}

async function checkSession() {
  if (!token) return false;
  const r = await api('/api/admin/session');
  return r.ok;
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+tab)?.classList.add('active');
  if (tab==='dashboard') loadDashboard();
  else if (tab==='users') loadUsers();
  else if (tab==='system') loadSystem();
}

function formatBytes(b) {
  if (b<1024) return b+' B';
  if (b<1048576) return (b/1024).toFixed(1)+' KB';
  if (b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('pt-BR');
}

// ── Dashboard ──
async function loadDashboard() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Carregando...</div>';
  const [stats,users] = await Promise.all([api('/api/admin/stats'), api('/api/admin/users')]);
  const s = stats.ok ? stats : {};
  const u = users.ok ? users : {users:[],total:0};
  main.innerHTML = `<h2>📊 Dashboard</h2>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Usuários</div><div class="value purple">${s.totalUsers||0}</div></div>
      <div class="stat-card"><div class="label">Ativos</div><div class="value green">${s.activeUsers||0}</div></div>
      <div class="stat-card"><div class="label">Bloqueados</div><div class="value red">${s.blockedCount||0}</div></div>
      <div class="stat-card"><div class="label">Storage Total</div><div class="value blue">${s.totalStorageGB||0} GB</div></div>
    </div>
    ${s.disk?`<div class="stats-grid">
      <div class="stat-card"><div class="label">Disco Total</div><div class="value">${s.disk.totalGB} GB</div></div>
      <div class="stat-card"><div class="label">Disco Usado</div><div class="value">${s.disk.usedGB} GB</div></div>
      <div class="stat-card"><div class="label">Disco Livre</div><div class="value green">${s.disk.freeGB} GB</div></div>
      <div class="stat-card"><div class="label">Uso Disco</div><div class="value ${s.disk.pct>80?'red':'blue'}">${s.disk.pct}%</div></div>
    </div>`:''}
    ${s.memory?`<div class="stats-grid">
      <div class="stat-card"><div class="label">RAM Total</div><div class="value">${s.memory.totalGB} GB</div></div>
      <div class="stat-card"><div class="label">RAM Livre</div><div class="value green">${s.memory.freeGB} GB</div></div>
      <div class="stat-card"><div class="label">Uso RAM</div><div class="value ${s.memory.pct>80?'red':'blue'}">${s.memory.pct}%</div></div>
    </div>`:''}
    <h3 style="margin-top:24px;margin-bottom:16px">Top Usuários por Storage</h3>
    ${u.users.length?`<table><thead><tr><th>Usuário</th><th>Email</th><th>Storage</th><th>Status</th></tr></thead><tbody>
      ${u.users.slice(0,10).map(u=>`<tr>
        <td>${esc(u.fullName||u.email||u.uid)}</td>
        <td>${esc(u.email||'—')}</td>
        <td>${formatBytes(u.storageBytes)}</td>
        <td><span class="badge ${u.blocked?'blocked':'active'}">${u.blocked?'Bloqueado':'Ativo'}</span></td>
      </tr>`).join('')}
    </tbody></table>`:'<div class="empty">Nenhum usuário encontrado</div>'}
  `;
}

// ── Usuários ──
async function loadUsers() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Carregando...</div>';
  const r = await api('/api/admin/users');
  if (!r.ok) { main.innerHTML = '<div class="empty">Erro: '+esc(r.error||'')+'</div>'; return; }
  const users = r.users || [];
  main.innerHTML = `<h2>👥 Usuários (${users.length})</h2>
    ${users.length?`<table><thead><tr><th>Nome</th><th>Email</th><th>Storage</th><th>Status</th><th style="width:200px">Ações</th></tr></thead><tbody>
      ${users.map(u=>`<tr>
        <td>${esc(u.fullName||'—')}</td>
        <td>${esc(u.email||'—')}</td>
        <td>${formatBytes(u.storageBytes)}</td>
        <td><span class="badge ${u.blocked?'blocked':'active'}">${u.blocked?'Bloqueado':'Ativo'}</span></td>
        <td>
          ${u.blocked
            ?`<button class="btn-sm btn-unblock" onclick="unblockUser('${u.uid}')">Desbloquear</button>`
            :`<button class="btn-sm btn-block" onclick="showBlockModal('${u.uid}','${esc(u.email||'')}','${esc(u.fullName||'')}')">Bloquear</button>`}
          <button class="btn-sm btn-detail" style="margin-left:6px" onclick="showUserDetail('${u.uid}')">Detalhes</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`:'<div class="empty">Nenhum usuário encontrado</div>'}
  `;
}

// ── Sistema ──
async function loadSystem() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Carregando...</div>';
  const r = await api('/api/admin/stats');
  if (!r.ok) { main.innerHTML = '<div class="empty">Erro ao carregar</div>'; return; }
  main.innerHTML = `<h2>🖥️ Sistema</h2>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Node.js</div><div class="value" style="font-size:18px">${r.nodeVersion||'—'}</div></div>
      <div class="stat-card"><div class="label">Uptime</div><div class="value" style="font-size:18px">${formatUptime(r.uptime||0)}</div></div>
      <div class="stat-card"><div class="label">Total Usuários</div><div class="value purple">${r.totalUsers||0}</div></div>
      <div class="stat-card"><div class="label">Bloqueados</div><div class="value red">${r.blockedCount||0}</div></div>
    </div>
    ${r.disk?`<h3 style="margin-top:24px;margin-bottom:16px">💾 Disco</h3>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total</div><div class="value">${r.disk.totalGB} GB</div></div>
      <div class="stat-card"><div class="label">Usado</div><div class="value">${r.disk.usedGB} GB</div></div>
      <div class="stat-card"><div class="label">Livre</div><div class="value green">${r.disk.freeGB} GB</div></div>
      <div class="stat-card"><div class="label">Uso</div><div class="value ${r.disk.pct>80?'red':'blue'}">${r.disk.pct}%</div></div>
    </div>`:''}
    ${r.memory?`<h3 style="margin-top:24px;margin-bottom:16px">🧠 Memória</h3>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total</div><div class="value">${r.memory.totalGB} GB</div></div>
      <div class="stat-card"><div class="label">Livre</div><div class="value green">${r.memory.freeGB} GB</div></div>
      <div class="stat-card"><div class="label">Uso</div><div class="value ${r.memory.pct>80?'red':'blue'}">${r.memory.pct}%</div></div>
    </div>`:''}
  `;
}

// ── Modal de bloqueio ──
function showBlockModal(uid, email, name) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = `<h3>🚫 Bloquear Usuário</h3>
    <p style="color:#94a3b8;font-size:14px;margin-bottom:16px">${esc(name||email)} (${esc(email||'sem email')})</p>
    <label>Motivo</label>
    <textarea id="block-reason" placeholder="Ex: Violação dos termos de uso"></textarea>
    <label>Expira em (opcional)</label>
    <input type="datetime-local" id="block-expires">
    <div class="actions">
      <button class="cancel-btn" onclick="closeModal()">Cancelar</button>
      <button class="confirm-btn" onclick="doBlock('${uid}')">Bloquear</button>
    </div>`;
  overlay.classList.add('active');
}

async function doBlock(uid) {
  const reason = document.getElementById('block-reason').value;
  const expires = document.getElementById('block-expires').value;
  const r = await api('/api/admin/users/'+uid+'/block', {
    method:'POST',
    body:JSON.stringify({reason:reason||undefined,expiresAt:expires?new Date(expires).toISOString():null})
  });
  closeModal();
  if (r.ok) { loadUsers(); } else { alert('Erro: '+(r.error||'')); }
}

async function unblockUser(uid) {
  if (!confirm('Desbloquear este usuário?')) return;
  const r = await api('/api/admin/users/'+uid+'/unblock', {method:'POST'});
  if (r.ok) { loadUsers(); } else { alert('Erro: '+(r.error||'')); }
}

async function showUserDetail(uid) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = '<div class="loading">Carregando...</div>';
  overlay.classList.add('active');
  const r = await api('/api/admin/users/'+uid);
  if (!r.ok) { content.innerHTML = '<p>Erro ao carregar</p>'; return; }
  content.innerHTML = `<h3>📋 Detalhes do Usuário</h3>
    <div class="user-detail-grid">
      <div class="item"><div class="label">Nome</div><div class="value">${esc(r.fullName||'—')}</div></div>
      <div class="item"><div class="label">Email</div><div class="value">${esc(r.email||'—')}</div></div>
      <div class="item"><div class="label">UID</div><div class="value" style="font-size:12px;word-break:break-all">${esc(r.uid)}</div></div>
      <div class="item"><div class="label">Criado em</div><div class="value">${formatDate(r.createdAt)}</div></div>
      <div class="item"><div class="label">Storage</div><div class="value">${formatBytes(r.storageBytes)}</div></div>
      <div class="item"><div class="label">Status</div><div class="value"><span class="badge ${r.blocked?'blocked':'active'}">${r.blocked?'Bloqueado':'Ativo'}</span></div></div>
    </div>
    ${r.blockEntry?`<div style="background:rgba(239,68,68,0.08);border-radius:12px;padding:16px;margin-bottom:20px">
      <p style="font-size:13px;color:#f87171;font-weight:600;margin-bottom:6px">🚫 Bloqueado</p>
      <p style="font-size:12px;color:#94a3b8">Motivo: ${esc(r.blockEntry.reason||'—')}</p>
      <p style="font-size:12px;color:#94a3b8">Desde: ${formatDate(r.blockEntry.blockedAt)}</p>
      <p style="font-size:12px;color:#94a3b8">Expira: ${r.blockEntry.expiresAt?formatDate(r.blockEntry.expiresAt):'Permanente'}</p>
    </div>`:''}
    <h4 style="margin-bottom:12px;font-size:14px;color:#94a3b8">📁 Arquivos (${r.files?r.files.length:0})</h4>
    <div class="file-list">
      ${r.files&&r.files.length?r.files.slice(0,50).map(f=>`<div class="file-row">
        <span class="path">${esc(f.path)}</span>
        <span class="size">${formatBytes(f.size)}</span>
      </div>`).join('')+'<p style="color:#64748b;font-size:12px;text-align:center;padding:8px">'+(r.files.length>50?'Mostrando 50 de '+r.files.length+' arquivos':'')+'</p>':'<p style="color:#64748b;font-size:13px">Nenhum arquivo</p>'}
    </div>
    <div class="actions">
      <button class="cancel-btn" onclick="closeModal()">Fechar</button>
    </div>`;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatUptime(sec) {
  const d = Math.floor(sec/86400);
  const h = Math.floor((sec%86400)/3600);
  const m = Math.floor((sec%3600)/60);
  const parts = [];
  if (d) parts.push(d+'d');
  if (h) parts.push(h+'h');
  parts.push(m+'m');
  return parts.join(' ');
}

// Init
(async function() {
  if (token) {
    const ok = await checkSession();
    if (ok) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.add('active');
      loadDashboard();
      return;
    }
    token = '';
    localStorage.removeItem('admin_token');
  }
})();
</script>
</body>
</html>
